<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Leave a note</title>
<style>*{box-sizing:border-box;margin:0}body{background:#0b1030;color:#eef3ff;font-family:Arial,sans-serif;padding:14px;touch-action:none}
h1{font-size:20px;margin-bottom:10px}canvas{width:100%;aspect-ratio:4/3;background:#17204a;border-radius:14px;display:block;touch-action:none}
.row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}.c{width:36px;height:36px;border-radius:50%;border:3px solid transparent}.c.on{border-color:#fff}
button{flex:1;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:700;background:#4f7cff;color:#fff}button.g{background:#2a3566}
#m{margin-top:10px;font-size:15px;color:#9fb0d6;min-height:20px}</style></head><body>
<h1>Leave a note</h1><canvas id="cv" width="800" height="600"></canvas>
<div class="row" id="cols"></div>
<div class="row"><button class="g" id="clr">Clear</button><button id="snd">Send to TV</button></div><div id="m"></div>
<script>
var cv=document.getElementById("cv"),x=cv.getContext("2d"),col="#ffffff",on=false,cols=["#ffffff","#ffd23f","#ff7a5a","#ff5fa2","#a77bff","#4fc3ff","#5fe08a"];
x.lineWidth=7;x.lineCap="round";x.lineJoin="round";
cols.forEach(function(c,i){var d=document.createElement("div");d.className="c"+(i?"":" on");d.style.background=c;d.onclick=function(){col=c;[].forEach.call(document.querySelectorAll(".c"),function(e){e.classList.remove("on")});d.classList.add("on")};document.getElementById("cols").appendChild(d)});
function p(e){var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*cv.width/r.width,(t.clientY-r.top)*cv.height/r.height]}
function st(e){e.preventDefault();on=true;var q=p(e);x.strokeStyle=col;x.beginPath();x.moveTo(q[0],q[1]);x.lineTo(q[0]+.1,q[1]);x.stroke()}
function mv(e){if(!on)return;e.preventDefault();var q=p(e);x.strokeStyle=col;x.lineTo(q[0],q[1]);x.stroke();x.beginPath();x.moveTo(q[0],q[1])}
function en(){on=false}
cv.addEventListener("touchstart",st);cv.addEventListener("touchmove",mv);cv.addEventListener("touchend",en);
cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);window.addEventListener("mouseup",en);
document.getElementById("clr").onclick=function(){x.clearRect(0,0,cv.width,cv.height)};
document.getElementById("snd").onclick=function(){
  fetch("/note",{method:"POST",body:cv.toDataURL("image/png")}).then(function(){document.getElementById("m").textContent="Sent to TV"}).catch(function(){document.getElementById("m").textContent="Could not reach the TV. Use the same Wi-Fi."});
};
</script></body></html>
